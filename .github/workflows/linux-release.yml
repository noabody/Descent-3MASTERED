name: Linux release package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libopenal-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libdecor-0-dev \
            libxkbcommon-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SDL=ON \
            -DD3_GAMEDIR=./ \
            -DCHECKSUM=2273889867UL \
            -DCMAKE_SKIP_RPATH=ON \
            -DSDL_X11_XTEST=OFF \
            -DSDL_X11_XSCRNSAVER=OFF

      - name: Build and Install release binaries
        run: |
          cmake --build build -j$(nproc)
          cmake --install build --prefix out/release/Descent-3MASTERED-Linux-x64

      - name: Package release binaries
        run: |
          cd out/release
          tar -cJf Descent-3MASTERED-Linux-x64.tar.xz Descent-3MASTERED-Linux-x64
          sha256sum Descent-3MASTERED-Linux-x64.tar.xz > Descent-3MASTERED-Linux-x64.tar.xz.sha256

      - name: Upload artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Descent-3MASTERED-Linux-x64
          path: |
            out/release/*.tar.xz
            out/release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            out/release/*.tar.xz
            out/release/*.sha256
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
